name: BXP CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install server dependencies
        run: |
          cd reference-server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run server tests
        run: |
          cd reference-server
          python -m pytest tests/ -v

      - name: Lint SDK
        run: |
          pip install pyflakes
          python -m pyflakes sdk/python/bxp_sdk.py

      - name: Lint CLI
        run: |
          python -m pyflakes cli/bxp_cli.py

      - name: Validate sample dataset
        run: |
          python -c "
          import json, sys
          with open('datasets/sample_readings.bxp.json') as f:
              data = json.load(f)
          print(f'Sample dataset: {len(data) if isinstance(data, list) else 1} record(s) — OK')
          "

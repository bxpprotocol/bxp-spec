name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r reference-server/requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || pip install pytest pytest-cov
      - name: Run server tests
        run: python -m pytest reference-server/tests/ -v --tb=short
      - name: Run SDK tests
        run: python -m pytest sdk/python/tests/ -v --tb=short
      - name: Run integration tests
        run: python -m pytest integrations/ -v --tb=short

  test-typescript:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          cd sdk/typescript && npm ci
      - name: Run tests
        run: |
          cd sdk/typescript && npm test

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Python conformance
        run: |
          cd conformance && python verify_python.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install TypeScript dependencies
        run: |
          cd sdk/typescript && npm ci
      - name: Run TypeScript conformance
        run: |
          cd conformance && node verify_typescript.mjs

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r reference-server/requirements.txt --desc on
      - name: Audit Node dependencies
        run: |
          cd sdk/typescript && npm audit --audit-level=high

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          # Check for basic HTML validity
          grep -q "<!DOCTYPE html>" docs/index.html
          grep -q "<html" docs/index.html
          grep -q "</html>" docs/index.html
      - name: Check links (basic)
        run: |
          # Check internal links exist
          grep -oP 'href="[^"#]+"' docs/index.html | sed 's/href="//;s/"//' | while read link; do
            if [[ "$link" == /* ]]; then
              if [ ! -f "docs${link}" ] && [ ! -d "docs${link}" ]; then
                echo "Broken internal link: $link"
                exit 1
              fi
            fi
          done

validate-spec:
    name: Validate Spec & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Spec header and section structure
        run: |
          head -1 SPEC.md | grep -q "^# BXP Technical Specification"
          grep -q "Stable" SPEC.md
          grep -q "17 conformance vectors" SPEC.md
      - name: Conformance vectors present
        run: |
          COUNT=$(ls conformance/vectors/*.bxp | wc -l)
          echo "vectors: $COUNT"
          test "$COUNT" -eq 17
      - name: Documentation integrity (fences, versions, HRI labelling)
        run: python scripts/check_docs.py
      - name: Internal anchor links resolve
        run: |
          python scripts/check_anchors.py SPEC.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md \
            docs/api_documentation.md docs/developer_guide.md
      - name: Table of contents is current
        run: python scripts/build_spec_toc.py --check
      - name: OpenAPI contract is current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json openapi.yaml
      - name: Reference pages generate cleanly
        run: |
          python scripts/build_reference_pages.py --out /tmp/pages
          for f in spec.html api.html agents.html versions.html; do
            test -s /tmp/pages/$f || { echo "empty output: $f"; exit 1; }
          done
          grep -q "id=\"1-abstract\"" /tmp/pages/spec.html
          grep -q "/bxp/v2/nearby" /tmp/pages/api.html
          grep -q "PM2_5" /tmp/pages/agents.html
          grep -q "zenodo" /tmp/pages/versions.html
          echo "reference pages verified"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test-python, test-typescript, conformance, security, build-docs, validate-spec]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Build Python package
        run: |
          pip install build twine
          python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
      - name: Build and publish npm package
        run: |
          cd sdk/typescript
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release artifacts
        run: |
          # Release artifacts already created by build step
          echo "Release published successfully"

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
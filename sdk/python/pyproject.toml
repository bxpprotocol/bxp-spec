[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bxp-sdk"
version = "2.1.0"
description = "BXP Protocol SDK — Breathe Exposure Protocol for atmospheric exposure data"
readme = "../../README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "BXP Protocol", email = "bxpprotocol@proton.me"},
]
keywords = ["air quality", "atmospheric", "exposure", "bxp", "health", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.24.0"]
all  = ["httpx>=0.24.0"]

[project.scripts]
bxp = "bxp_sdk.cli:main"

[project.urls]
Homepage   = "https://github.com/bxpprotocol/bxp-spec"
Repository = "https://github.com/bxpprotocol/bxp-spec"
Issues     = "https://github.com/bxpprotocol/bxp-spec/issues"
DOI        = "https://doi.org/10.5281/zenodo.18906812"

[tool.setuptools.packages.find]
where = ["."]
include = ["bxp_sdk*"]

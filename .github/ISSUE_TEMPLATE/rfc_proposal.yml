---
name: 📋 RFC Proposal
description: Propose a specification change via the RFC process (30-day comment period)
title: "[RFC] "
labels: ["rfc", "specification", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## BXP RFC Process

        Per [CONTRIBUTING.md](https://github.com/bxpprotocol/bxp-spec/blob/main/CONTRIBUTING.md) and [SPEC.md §12.3](https://github.com/bxpprotocol/bxp-spec/blob/main/SPEC.md#123-rfc-process), all specification changes require a 30-day public comment period.

        **Before submitting:** Search existing RFCs to avoid duplicates. Discussion happens in GitHub Issues with the `rfc` label.

  - type: input
    id: rfc_number
    attributes:
      label: RFC Number (assigned by maintainer)
      description: Leave blank — maintainer will assign
      placeholder: "RFC-001"

  - type: input
    id: title
    attributes:
      label: RFC Title
      description: Concise, descriptive title
      placeholder: "Add NOx composite agent to agent registry"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Change Category
      options:
        - New agent/agent group
        - New API endpoint
        - File format change (binary or JSON)
        - HRI methodology change
        - Privacy framework change
        - Federation protocol change
        - QC/quality framework change
        - Versioning/compatibility policy
        - Deprecation/removal
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Compatibility Impact
      options:
        - Backward compatible (MINOR version bump)
        - Breaking change (MAJOR version bump required)
        - Clarification only (no version bump)
        - Experimental/opt-in (feature flag)
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed? What problem does it solve? Provide evidence, use cases, or references.
      placeholder: "Current agent registry lacks a composite NOx agent. Many sensors report NOx = NO + NO2. Without this, users must compute it client-side, leading to inconsistencies..."
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Detailed Specification
      description: Exact changes to SPEC.md. Include new fields, enums, validation rules, examples. Be precise.
      placeholder: |
        ## New Agent Entry (Appendix A)
        | Agent ID | Name | Unit | Category | WHO Guideline | HRI Weight |
        |----------|------|------|----------|---------------|------------|
        | NOX | Nitrogen Oxides | ppb | gas | — | 0.12 |

        ## API Changes
        - Add `NOX` to valid `agentId` enum in `/readings` POST
        - Update validation in `validate_bxp_record()`
      render: markdown
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Plan
      description: What code changes are needed? Which files? Who will implement?
      placeholder: |
        1. Update SPEC.md Appendix A with NOX entry
        2. Add NOX to agent registry in bxp_sdk.py and bxp-sdk.ts
        3. Update conformance vectors with NOX examples
        4. Add NOX to validator.html agent list
        5. Update CHANGELOG.md
    validations:
      required: true

  - type: textarea
    id: migration
    attributes:
      label: Migration Strategy
      description: How do existing implementations migrate? Any dual-version support needed?
      placeholder: "MINOR bump — existing implementations ignore unknown agentId per SPEC §5.7. No breaking changes."

  - type: textarea
    id: testing
    attributes:
      label: Testing & Conformance
      description: How will this be tested? New conformance vectors needed?
      placeholder: "Add 2 new conformance vectors: minimal_reading_with_nox.bxp and full_reading_with_nox.bxp"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you evaluate? Why reject them?
      placeholder: "Considered adding NOx as calculated field in HRI only, but sensors need to report it directly for interoperability."

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to related issues, PRs, external standards, scientific papers
      placeholder: "Related: #42 (agent registry expansion), WHO AQG 2021 Section 4.2"

  - type: checkboxes
    id: checklist
    attributes:
      label: RFC Checklist
      options:
        - label: I have read CONTRIBUTING.md §2 and SPEC.md §12.3 (RFC process)
          required: true
        - label: This is a specification change (not just implementation)
          required: true
        - label: I understand this requires 30-day public comment before acceptance
          required: true
        - label: I will update SPEC.md, CHANGELOG.md, and conformance vectors if accepted
          required: true
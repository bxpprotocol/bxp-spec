[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bxp-scout"
version = "1.0.0"
description = "BXP Integration Scout - read-only discovery agent for BXP integration opportunities"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
bxp-scout = "bxp_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bxp_scout*"]

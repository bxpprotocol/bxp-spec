name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # Manual publication. The release event proved unreliable in practice on this
  # repository: a correctly published release produced no run at all, leaving no
  # way to publish without editing tags. This gives a direct path.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the package registries"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r reference-server/requirements.txt
          pip install -r requirements-dev.txt
      - name: Reference server tests
        run: python -m pytest reference-server/tests/ -v --tb=short
      - name: SDK tests
        run: python -m pytest sdk/python/tests/ -v --tb=short
      - name: Integration tests
        run: python -m pytest integrations/ -v --tb=short

  test-typescript:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: cd sdk/typescript && npm ci
      - name: Typecheck
        run: cd sdk/typescript && npm run typecheck
      - name: Test
        run: cd sdk/typescript && npm test

  conformance:
    name: Conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: cd sdk/typescript && npm ci
      - name: Python implementation
        run: python conformance/verify_python.py
      - name: TypeScript implementation
        run: node conformance/verify_typescript.mjs

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r reference-server/requirements.txt
          pip install -r requirements-dev.txt

      - name: Specification states its own stability and version
        run: |
          head -1 SPEC.md | grep -q "^# BXP Technical Specification"
          grep -q "Status" SPEC.md
          grep -q "Stable" SPEC.md
          grep -q "experimental" SPEC.md

      - name: Conformance vector count
        run: |
          COUNT=$(ls conformance/vectors/*.bxp | wc -l)
          echo "vectors: $COUNT"
          test "$COUNT" -eq 17

      - name: Fence balance, version agreement, HRI labelling
        run: python scripts/check_docs.py

      - name: Internal anchor links resolve
        run: |
          python scripts/check_anchors.py SPEC.md README.md CHANGELOG.md \
            CONTRIBUTING.md SECURITY.md docs/api_documentation.md \
            docs/developer_guide.md

      - name: Table of contents is current
        run: python scripts/build_spec_toc.py --check

      - name: Workflow files are valid
        run: python scripts/check_workflows.py

      - name: pyproject.toml is valid TOML and packaging is consistent
        run: python scripts/check_pyproject.py

      - name: Sample dataset validates against the SDK validator
        run: python scripts/check_dataset.py

      - name: Committed OpenAPI contract matches the server
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json openapi.yaml

  artefacts:
    name: Published artefacts generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every published artefact builds
        run: |
          python scripts/build_reference_pages.py --out /tmp/pages
          python scripts/build_site_artifacts.py --out /tmp/site
          python scripts/build_feed.py --out /tmp/feed
          python scripts/build_data_page.py --out /tmp/data
      - name: Assert the artefacts are non-trivial
        run: |
          test -s /tmp/site/llms-full.txt
          test -s /tmp/site/openapi.json
          test -s /tmp/site/sample_readings.bxp.json
          test -f /tmp/site/.nojekyll
          test -s /tmp/feed/feed.xml
          test -s /tmp/data/data.html
          for f in spec api agents versions; do test -s /tmp/pages/$f.html; done
      - name: Assert the contract is complete
        run: |
          python -c "
          import json
          spec = json.load(open('/tmp/site/openapi.json'))
          paths = spec['paths']
          assert len(paths) >= 20, sorted(paths)
          for required in ('/bxp/v2/readings', '/bxp/v2/nearby', '/bxp/v2/sync'):
              assert required in paths, required
          print(len(paths), 'paths verified')
          "

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install pip-audit
      - run: cd sdk/typescript && npm ci
      - name: Python advisories
        run: pip-audit -r reference-server/requirements.txt --desc on
      - name: Node advisories
        run: cd sdk/typescript && npm audit --audit-level=high

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test-python, test-typescript, conformance, docs, artefacts, security]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the Python wheel
        run: |
          pip install -r reference-server/requirements.txt
          pip install build
          python -m build
      - name: Verify the wheel installs and imports
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import bxp_sdk; print('sdk imports ok')"
      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    # Independent of PyPI on purpose. A missing or expired NPM_TOKEN must not
    # block or confuse a successful Python release, and vice versa.
    #
    # The `secrets` context is not available in a job-level `if`, which makes
    # the whole workflow fail to parse. Job-level `env` may reference secrets,
    # so the check happens at step level instead.
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Report that npm publishing is not configured
        if: env.NPM_TOKEN_PRESENT != 'true'
        run: echo "NPM_TOKEN is not configured. Skipping the npm publish; PyPI is unaffected."
      - uses: actions/checkout@v7
        if: env.NPM_TOKEN_PRESENT == 'true'
      - uses: actions/setup-python@v5
        if: env.NPM_TOKEN_PRESENT == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN_PRESENT == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Verify the tarball before uploading
        if: env.NPM_TOKEN_PRESENT == 'true'
        run: |
          pip install -r reference-server/requirements.txt
          python scripts/verify_packages.py
      - name: Publish to npm
        if: env.NPM_TOKEN_PRESENT == 'true'
        run: cd sdk/typescript && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
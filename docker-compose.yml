## BXP Protocol — Docker Compose
## Quick start:
##   cp .env.example .env   # then edit
##   docker compose up -d

services:
  bxp-node:
    build: .
    container_name: bxp-reference-node
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    volumes:
      - bxp_data:/data

volumes:
  bxp_data:
